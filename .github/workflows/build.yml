# =============================================================================
# memcached-docker-build · GitHub Actions 构建流水线（多架构）
#
# 分支与版本语义（本文件位于 main 分支）：
#   - 主线版本：push 到 main / master，读取仓库根 VERSION 文件得到项目版本号
#       * 版本号变化 -> 自动打 tag v<版本>、发布 Release、推送版本化 Docker 镜像
#       * 版本号未变 -> 只执行构建验证（不发布、不推镜像）
#   - 稳定版本：打 git tag（vMemcached-1.6.45）触发，从 tag 名解析 memcached 版本，
#     发布到同名 tag（固化）
#   - 手动触发：workflow_dispatch 可指定任意版本 / libevent 模式 / 架构
#
# 架构说明：
#   x86_64  -> ubuntu-latest 原生构建，基础镜像 centos:7.6.1810（glibc 2.17）
#   aarch64 -> ubuntu-24.04-arm 原生 ARM runner，基础镜像 arm64v8/centos:7（glibc 2.17）
#
# 产物形态：
#   1) tar.gz 制品（Release 附件 + Workflow Artifact）：memcached + memcached-tool +
#      man 手册 + install.sh + memcached.service + memcached.sysconfig + windows/ + 许可证
#   2) 多架构 Docker 运行时镜像：ghcr.io/<owner>/memcached:<版本>（含 :latest 别名）
#
# 注意：`ubuntu-24.04-arm` 目前仅对 public 仓库免费；若仓库为 private，
#   请把 aarch64 的 runner 改回 `ubuntu-latest` 并把 qemu 置为 "true"。
#
# TLS 说明：memcached 的 --enable-tls 要求 OpenSSL >= 1.1.0，而 EL7 只有 1.0.2k，
#   因此本流水线不产出 TLS 版本。需要 TLS 请在目标机原生编译：
#       ./build-native.sh <版本> system yes
# =============================================================================
name: build-memcached

on:
  workflow_dispatch:
    inputs:
      memcached-version:
        description: "memcached 版本号（如 1.6.45 / 1.5.22）"
        required: false
        default: "1.6.45"
      libevent:
        description: "libevent 链接方式 auto|static|system（默认 auto，镜像内为静态）"
        required: false
        default: "auto"
      sasl:
        description: "是否编译 SASL 认证 yes|no（需 cyrus-sasl-devel）"
        required: false
        default: "no"
      seccomp:
        description: "是否启用 seccomp 限制 yes|no（需 libseccomp-devel，memcached>=1.5.16）"
        required: false
        default: "no"
      tls:
        description: "TLS 仅支持目标机原生编译（容器内 OpenSSL 1.0.2k < 1.1.0），填 yes 会直接报错"
        required: false
        default: "no"
      arch:
        description: "构建架构 all|x86_64|aarch64"
        required: false
        default: "all"
      smoke:
        description: "是否执行 version + set/get 冒烟测试 yes|no"
        required: false
        default: "yes"
  push:
    branches: [main, master]
    tags: ["vMemcached-*"]

permissions:
  contents: write
  packages: write

jobs:
  # ── 解析构建场景与版本（供矩阵复用） ──────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      scene: ${{ steps.resolve.outputs.scene }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      libevent: ${{ steps.resolve.outputs.libevent }}
      sasl: ${{ steps.resolve.outputs.sasl }}
      seccomp: ${{ steps.resolve.outputs.seccomp }}
      smoke: ${{ steps.resolve.outputs.smoke }}
      project_version: ${{ steps.ver.outputs.version }}
      version_changed: ${{ steps.ver.outputs.version_changed }}
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        name: 解析场景与版本
        run: |
          set -e
          DEFAULT_VERSION="1.6.45"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.memcached-version }}"; V="${V:-$DEFAULT_VERSION}"
            L="${{ github.event.inputs.libevent }}";        L="${L:-auto}"
            SA="${{ github.event.inputs.sasl }}";           SA="${SA:-no}"
            SE="${{ github.event.inputs.seccomp }}";        SE="${SE:-no}"
            S="${{ github.event.inputs.smoke }}";           S="${S:-yes}"
            echo "scene=dispatch"                >> "$GITHUB_OUTPUT"
            echo "version=$V"                    >> "$GITHUB_OUTPUT"
            echo "release_tag=vMemcached-$V"     >> "$GITHUB_OUTPUT"
            echo "libevent=$L"                   >> "$GITHUB_OUTPUT"
            echo "sasl=$SA"                      >> "$GITHUB_OUTPUT"
            echo "seccomp=$SE"                   >> "$GITHUB_OUTPUT"
            echo "smoke=$S"                      >> "$GITHUB_OUTPUT"
            echo ">>> 场景: 手动构建，版本=$V，libevent=$L"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            REF="${{ github.ref_name }}"
            case "$REF" in
              vMemcached-*) V="${REF#vMemcached-}" ;;
              *) echo "::error::未知 tag 格式: $REF（应为 vMemcached-x.y.z）"; exit 1 ;;
            esac
            echo "scene=tag"                     >> "$GITHUB_OUTPUT"
            echo "version=$V"                    >> "$GITHUB_OUTPUT"
            echo "release_tag=$REF"              >> "$GITHUB_OUTPUT"
            echo "libevent=auto"                 >> "$GITHUB_OUTPUT"
            echo "sasl=no"                       >> "$GITHUB_OUTPUT"
            echo "seccomp=no"                    >> "$GITHUB_OUTPUT"
            echo "smoke=yes"                     >> "$GITHUB_OUTPUT"
            echo ">>> 场景: 稳定版构建，tag=$REF，版本=$V"
          else
            echo "scene=mainline"                >> "$GITHUB_OUTPUT"
            echo "version=$DEFAULT_VERSION"      >> "$GITHUB_OUTPUT"
            echo "release_tag=latest"            >> "$GITHUB_OUTPUT"
            echo "libevent=auto"                 >> "$GITHUB_OUTPUT"
            echo "sasl=no"                       >> "$GITHUB_OUTPUT"
            echo "seccomp=no"                    >> "$GITHUB_OUTPUT"
            echo "smoke=yes"                     >> "$GITHUB_OUTPUT"
            echo ">>> 场景: 主线构建，版本=$DEFAULT_VERSION"
          fi

      - id: ver
        name: 读取 VERSION 并判断版本是否变化
        run: |
          set -e
          # VERSION 是项目版本号的唯一来源（规则：默认 1.0；每次提交 +0.0.1；
          # 漏洞修复 +0.1；大改动/重写 +1）
          V="$(tr -d '[:space:]' < VERSION)"
          [ -n "$V" ] || { echo "::error::VERSION 文件为空或缺失"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo ">>> 项目版本: $V"

          # tag 推送 / 手动触发不参与「版本变化」判定，直接按既有语义发布
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 主线：该版本是否已经打过 tag / 发过 Release？
          if git ls-remote --tags --exit-code origin "v$V" >/dev/null 2>&1; then
            echo ">>> v$V 已存在 -> 版本未变化，本次只做构建验证"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo ">>> v$V 不存在 -> 版本有变化，将打 tag / 发 Release / 推镜像"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # TLS 前置拦截：给出可操作的说明，而不是让 Docker 构建跑到一半才失败
      - name: TLS 前置检查
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tls == 'yes'
        run: |
          echo "::error::CI 无法产出 TLS 版本：memcached 的 --enable-tls 要求 OpenSSL >= 1.1.0，"
          echo "::error::而 CentOS 7 / EL7 仓库只有 OpenSSL 1.0.2k。"
          echo "::error::请在目标机（银河麒麟 V10 SP3 / UOS / EL8+，自带 OpenSSL 1.1.1）原生编译："
          echo "::error::    ./build-native.sh <版本> system yes"
          exit 1

      # 镜像名必须全小写（Docker 强制要求），而 ${{ github.repository_owner }} 可能
      # 含大写（如 JackCh3n），直接用会报 "repository name must be lowercase"。
      - id: img
        name: 计算镜像名（小写）
        run: |
          set -e
          OWNER="${{ github.repository_owner }}"
          IMG="ghcr.io/${OWNER,,}/memcached"
          echo ">>> 镜像: ${IMG}"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"

  # ── 构建（矩阵：x86_64 + aarch64） ─────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            base_image: centos:7.6.1810
            platform: linux/amd64
            docker_arch: amd64
            qemu: "false"
          # private 仓库请改为 runner: ubuntu-latest / qemu: "true"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base_image: arm64v8/centos:7
            platform: linux/arm64
            docker_arch: arm64
            qemu: "false"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 架构过滤（workflow_dispatch 可只构建单一架构）
        id: filter
        run: |
          WANT="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.arch || 'all' }}"
          WANT="${WANT:-all}"
          if [ "$WANT" = "all" ] || [ "$WANT" = "${{ matrix.arch }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo ">>> 跳过 ${{ matrix.arch }}（本次只构建 $WANT）"
          fi

      # aarch64 在 x86_64 runner 上需要 QEMU
      - name: 注册 QEMU（aarch64）
        if: steps.filter.outputs.skip == 'false' && matrix.qemu == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 准备 buildx
        if: steps.filter.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: 构建编译镜像（EL7 + devtoolset-10 + 静态 libevent）
        if: steps.filter.outputs.skip == 'false'
        run: |
          set -e
          # SASL / seccomp 需要额外的 -devel 包；libevent 由 Dockerfile 内源码静态构建
          OPT_DEPS=no
          if [ "${{ needs.prepare.outputs.sasl }}" = "yes" ] || [ "${{ needs.prepare.outputs.seccomp }}" = "yes" ]; then
            OPT_DEPS=yes
          fi
          echo ">>> INSTALL_OPT_DEPS=${OPT_DEPS}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            --build-arg INSTALL_OPT_DEPS="${OPT_DEPS}" \
            -t memcached-builder:el7 --load .

      - name: 编译 memcached ${{ needs.prepare.outputs.version }}（${{ matrix.arch }}）
        if: steps.filter.outputs.skip == 'false'
        run: |
          set -e
          mkdir -p dist
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/dist:/opt/dist" \
            memcached-builder:el7 \
            --memcached-version "${{ needs.prepare.outputs.version }}" \
            --libevent "${{ needs.prepare.outputs.libevent }}" \
            --sasl "${{ needs.prepare.outputs.sasl }}" \
            --seccomp "${{ needs.prepare.outputs.seccomp }}" \
            --smoke "${{ needs.prepare.outputs.smoke }}" \
            --output /opt/dist

      - name: 展示构建信息
        if: steps.filter.outputs.skip == 'false'
        run: |
          set -e
          for d in dist/*/; do
            echo "===== $d ====="
            cat "${d}BUILD-INFO.txt" 2>/dev/null | head -n 40 || true
          done

      - name: 装入 install.sh 与 assets（使产物包自包含）
        if: steps.filter.outputs.skip == 'false'
        run: |
          set -e
          # 注意：dist/<包目录> 是 docker 容器以 root 创建的，runner 用户无法直接写入，
          # 所以这里必须用 sudo（CNB 侧 stage 本身以 root 运行，无需 sudo）
          for d in dist/*/; do
            [ -d "$d" ] || continue
            sudo install -m 0755 install.sh                    "${d}install.sh"
            sudo install -m 0644 assets/memcached.service      "${d}memcached.service"
            sudo install -m 0644 assets/memcached.sysconfig    "${d}memcached.sysconfig"
            # 项目自身许可证（MIT）；上游 memcached / libevent 许可证由 build-memcached.sh 生成
            sudo install -m 0644 LICENSE                       "${d}LICENSE"
            # Windows 场景（WSL2 安装向导与说明），使产物包在 Windows 下同样自包含
            sudo rm -rf "${d}windows"
            sudo cp -r windows "${d}windows"
          done
          # 防御：dist 由容器内 root 写入。非 root 的 runner 在下一步 tar 打包时会
          # Permission denied，这里统一放开读权限（a+rX 不会给二进制额外加执行位）。
          sudo chmod -R a+rX dist/
          ls -lh dist/*/

      - name: 打包
        if: steps.filter.outputs.skip == 'false'
        run: |
          set -e
          cd dist
          for d in */; do tar czf "${d%/}.tar.gz" "${d%/}"; done
          ls -lh *.tar.gz

      - name: 上传产物（Workflow Artifact）
        if: steps.filter.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: memcached-binaries-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 30

      # 版本化 Docker 镜像：仅「主线且版本有变化」时推送
      - name: 构建并推送架构镜像 ${{ needs.prepare.outputs.project_version }}
        if: >-
          steps.filter.outputs.skip == 'false' &&
          needs.prepare.outputs.scene == 'mainline' &&
          needs.prepare.outputs.version_changed == 'true'
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -e
          V="${{ needs.prepare.outputs.project_version }}"
          echo ">>> 推送 ${IMAGE}:${V}-${{ matrix.docker_arch }}"
          docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f docker/Dockerfile \
            --build-arg "PKG_DIR=dist/memcached-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}" \
            -t "${IMAGE}:${V}-${{ matrix.docker_arch }}" \
            --push .

  # ── 汇总发布 Release / 镜像 ──────────────────────────────────────────
  # 主线且版本未变化时整个 job 跳过（只验证，不发布）
  release:
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.scene != 'mainline' ||
      needs.prepare.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    # job 级 env：让所有步骤（含最后的「汇总」）都能拿到这些变量
    env:
      GH_TOKEN: ${{ github.token }}
      SCENE: ${{ needs.prepare.outputs.scene }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PROJECT_VERSION: ${{ needs.prepare.outputs.project_version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      LIBEVENT_MODE: ${{ needs.prepare.outputs.libevent }}
      SASL_FLAG: ${{ needs.prepare.outputs.sasl }}
      SECCOMP_FLAG: ${{ needs.prepare.outputs.seccomp }}
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部架构产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 主线且版本变化：打项目版本 tag（v<版本>）。
      # 用 GITHUB_TOKEN 推送不会再次触发工作流（GitHub 官方行为）；
      # 且 tag 名是 v1.2.3 形式，也不匹配本工作流的 vMemcached-* 触发模式。
      - name: 打项目版本 tag
        if: needs.prepare.outputs.scene == 'mainline'
        run: |
          set -e
          V="${{ needs.prepare.outputs.project_version }}"
          if git ls-remote --tags --exit-code origin "v$V" >/dev/null 2>&1; then
            echo ">>> tag v$V 已存在，跳过创建"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "release v$V" "${{ github.sha }}"
          git push origin "refs/tags/v$V"
          echo ">>> 已创建并推送 tag v$V"

      - name: 发布 Release
        run: |
          set -e
          ls -lh artifacts

          # 主线：发布到项目版本 tag，同时刷新 latest 滚动别名
          if [ "$SCENE" = "mainline" ]; then
            REL_TAG="v$PROJECT_VERSION"
          else
            REL_TAG="$RELEASE_TAG"
          fi

          X64="memcached-${VERSION}-x86_64.tar.gz"
          ARM="memcached-${VERSION}-aarch64.tar.gz"
          FILES=""
          for f in "$X64" "$ARM"; do
            if [ -f "artifacts/$f" ]; then
              cp "artifacts/$f" "$f"
              FILES="$FILES $f"
            else
              echo ">>> 未找到 $f，跳过"
            fi
          done
          if [ -z "$FILES" ]; then
            echo "::error::没有任何产物可发布"
            exit 1
          fi

          case "$SCENE" in
            mainline) TITLE="memcached-docker-build ${PROJECT_VERSION} (memcached ${VERSION})" ;;
            tag)      TITLE="Stable memcached ${VERSION}" ;;
            *)        TITLE="memcached ${VERSION}" ;;
          esac

          cat > notes.md <<EOF
          ## ${TITLE}

          memcached ${VERSION}, built in a Docker-simulated CentOS 7 (glibc 2.17) environment.

          | Arch | Asset | Runs on |
          |------|-------|---------|
          | x86_64 | ${X64} | CentOS 7.6 / 7.9 及更高 |
          | aarch64 | ${ARM} | glibc >= 2.17 的 aarch64（含银河麒麟 V10 SP3） |

          - **libevent: statically linked** — 产物不依赖任何 libevent 动态库。
            这一点很关键：EL7 的产物原本会链接 \`libevent-2.0.so.5\`，而麒麟 V10 / openEuler /
            UOS 普遍是 \`libevent-2.1.so.6\` 甚至未安装，动态链接会直接起不来。
          - libevent mode: \`${LIBEVENT_MODE}\`（镜像内以 \`--disable-shared --with-pic\` 源码构建）
          - SASL: \`${SASL_FLAG}\`，seccomp: \`${SECCOMP_FLAG}\`，TLS: 未启用
            （memcached TLS 要求 OpenSSL >= 1.1.0，EL7 只有 1.0.2k；需要 TLS 请用 \`build-native.sh\` 在目标机原生编译）
          - Toolchain: CentOS 7 vault 归档源 + devtoolset-10（GCC 10.2）

          ### Docker 镜像（多架构）

          \`\`\`bash
          docker pull ${IMAGE}:${PROJECT_VERSION}          # 或 :latest
          docker run -d --name memcached -p 11211:11211 -e CACHESIZE=256 ${IMAGE}:${PROJECT_VERSION}
          \`\`\`

          镜像内参数通过环境变量调整（键名与 \`/etc/sysconfig/memcached\` 一致）：
          \`PORT\` / \`CACHESIZE\` / \`MAXCONN\` / \`OPTIONS\`。
          ⚠️ 基础镜像是 glibc 系（debian），**不要**换成 alpine（musl，产物起不来）。

          ### 离线一键安装

          每个包都是自包含的：解压后 \`sudo ./install.sh\` 即可安装或原地更新（自动比对版本、
          备份旧二进制、创建 memcached 系统用户、安装 systemd 单元与 /etc/sysconfig/memcached）。

          \`\`\`bash
          tar xzf ${ARM}
          cd ${ARM%.tar.gz}
          sudo ./install.sh          # 安装 / 更新
          ./install.sh --check       # 只看会做什么，不做改动
          \`\`\`

          Windows 用户：包内 \`windows/\` 目录提供 WSL2 一键安装脚本（\`memcached-wsl.bat\`，纯 cmd 实现）。

          包内含：\`memcached\`、\`memcached-tool\`、\`man/memcached.1\`、\`install.sh\`、
          \`memcached.service\`、\`memcached.sysconfig\`、\`windows/\`、\`BUILD-INFO.txt\`，
          以及 \`LICENSE\`（本项目 MIT）、\`LICENSE.memcached.txt\`、
          \`LICENSE.libevent.txt\`（静态链接 libevent 时必须随包分发其许可证原文）。

          > memcached 为 **BSD-3-Clause**，libevent 亦为 **BSD-3-Clause**。
          EOF

          publish() {
            local tag="$1"
            if gh release view "$tag" --json id -q .id >/dev/null 2>&1; then
              echo ">>> Release $tag 已存在，更新附件"
              gh release view "$tag" --json assets -q '.assets[]?.name' | while read -r f; do
                [ -z "$f" ] && continue
                aid=$(gh release view "$tag" --json assets -q ".assets[] | select(.name==\"$f\") | .id")
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" >/dev/null 2>&1 || true
              done
              for f in $FILES; do gh release upload "$tag" "$f" --clobber; done
              gh release edit "$tag" --title "$TITLE" --notes-file notes.md --draft=false
            else
              # shellcheck disable=SC2086
              gh release create "$tag" $FILES --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA"
            fi
          }

          publish "$REL_TAG"
          # 主线场景同时刷新 latest 滚动别名（指向同一批产物）
          if [ "$SCENE" = "mainline" ] && [ "$REL_TAG" != "latest" ]; then
            publish "latest"
          fi

      # 把两个架构镜像合成一个多架构 manifest（amd64 + arm64）
      - name: 合并多架构镜像
        if: needs.prepare.outputs.scene == 'mainline'
        run: |
          set -e
          docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          echo ">>> 合成 ${IMAGE}:${PROJECT_VERSION} 与 ${IMAGE}:latest"
          docker buildx imagetools create \
            -t "${IMAGE}:${PROJECT_VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${PROJECT_VERSION}-amd64" \
            "${IMAGE}:${PROJECT_VERSION}-arm64"

      - name: 汇总
        run: |
          echo "场景        : $SCENE"
          echo "memcached   : $VERSION"
          echo "项目版本    : $PROJECT_VERSION"
          echo "Release     : $([ "$SCENE" = mainline ] && echo "v$PROJECT_VERSION + latest" || echo "$RELEASE_TAG")"
          echo "镜像        : $IMAGE:$PROJECT_VERSION , $IMAGE:latest"
          ls -lh *.tar.gz 2>/dev/null || true
